<h1>Simple counter APP</h1>
<p>Counter : {{counter}}</p>
<div>
  <button (click)="handle('plus')">+</button>
  <button (click)="handle('minus')">-</button>
  <button (click)="handle('reset')">Reset</button>
  <hr>
  <input (input)="handleinput($event.target.value);" type="text" placeholder="enter the input message">
  <br>
  <p>message:{{message}}</p>
  <br>
  <input (input)="city=$event.target.value" type="text" placeholder="enter the city name">
  <br>
<p>city:{{city}}</p>
<br>
<input #userinput placeholder="Enter country">
<button (click)="getCountry(userinput.value)">get Country</button>
<br>
<p>{{country}}</p>
</div>
